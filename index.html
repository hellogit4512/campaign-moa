<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체험모아</title>
<meta name="description" content="흩어진 블로그 체험단 모집을 한곳에서. 지역·채널·경쟁률로 고르고 신청부터 리뷰까지 관리하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 상단 고정 검색바 + 왼쪽 필터 레일(데스크톱) / 하단 시트(모바일) + 사진 카드 그리드 */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --sunken: #E9EDF3; --ink: #151D2E; --muted: #5B6578; --faint: #8A93A5; --line: #DEE3EB;
  --accent: #2A52D4; --accent-ink: #FFFFFF; --accent-weak: #E6ECFF;
  --mark: #FFE14D; --mark-ink: #2B2400; --hot: #D93A3F; --hot-weak: #FDE8E8; --good: #13865B; --good-weak: #E1F5EC;
  --shadow: 0 1px 2px rgb(21 29 46 / .06), 0 8px 24px -12px rgb(21 29 46 / .18);
  --f-display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 14px; --r-sm: 9px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1320; --surface: #161D2D; --sunken: #1D2537; --ink: #E7EBF3; --muted: #9AA4B8; --faint: #6E7891; --line: #283149;
  --accent: #7E9CFF; --accent-ink: #0E1320; --accent-weak: #1F2A4C;
  --mark: #E9CF3A; --mark-ink: #1D1800; --hot: #FF6E72; --hot-weak: #3A1C22; --good: #3FCB90; --good-weak: #15322A;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -12px rgb(0 0 0 / .6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1320; --surface: #161D2D; --sunken: #1D2537; --ink: #E7EBF3; --muted: #9AA4B8; --faint: #6E7891; --line: #283149;
  --accent: #7E9CFF; --accent-ink: #0E1320; --accent-weak: #1F2A4C;
  --mark: #E9CF3A; --mark-ink: #1D1800; --hot: #FF6E72; --hot-weak: #3A1C22; --good: #3FCB90; --good-weak: #15322A;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -12px rgb(0 0 0 / .6);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── 상단바 ── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); flex: none; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 15px var(--f-display); }
.brand-name { font: 800 19px var(--f-display); letter-spacing: -.03em; }
.search { flex: 1; min-width: 0; position: relative; max-width: 560px; }
.search input { width: 100%; height: 42px; border-radius: 999px; border: 1px solid var(--line); background: var(--sunken); padding: 0 16px 0 40px; outline: none; }
.search input:focus { border-color: var(--accent); background: var(--surface); }
.search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; stroke: var(--faint); }
.tabs { display: flex; gap: 4px; flex: none; margin-left: auto; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 999px; color: var(--muted); font-weight: 500; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab .cnt { font: 600 12px var(--f-num); opacity: .75; }
@media (max-width: 760px) {
  .top .wrap { flex-wrap: wrap; gap: 10px; padding-block: 10px; }
  .brand-name { font-size: 17px; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .tab { padding: 7px 10px; font-size: 14px; }
}

/* ── 요약 띠 ── */
.pulse { padding-block: 22px 6px; display: flex; flex-wrap: wrap; align-items: end; gap: 12px 28px; }
.pulse h1 { margin: 0; font: 800 clamp(22px, 3.2vw, 30px)/1.25 var(--f-display); letter-spacing: -.035em; text-wrap: balance; }
.pulse h1 em { font-style: normal; background: linear-gradient(transparent 58%, var(--mark) 58%); color: inherit; padding: 0 2px; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; margin-left: auto; }
.stat { display: grid; gap: 1px; }
.stat b { font: 600 20px var(--f-num); letter-spacing: -.02em; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.hot b { color: var(--hot); }
.fresh { padding-block: 0 14px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.fresh button { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 6px; }
.dot.warn { background: var(--hot); }

/* ── 본문 레이아웃 ── */
.layout { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 28px; padding-block: 8px 64px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* 필터 레일 */
.filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); max-height: calc(100vh - 100px); overflow: auto; display: grid; gap: 20px; padding-bottom: 8px; scrollbar-width: thin; }
.fgroup { display: grid; gap: 9px; }
.fgroup > h3 { margin: 0; font: 600 12px var(--f-body); color: var(--muted); letter-spacing: .06em; display: flex; justify-content: space-between; align-items: baseline; }
.h3-actions { display: inline-flex; gap: 10px; }
.fgroup > h3 button { border: 0; background: none; color: var(--accent); font-size: 12px; letter-spacing: 0; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13.5px; display: inline-flex; gap: 5px; align-items: baseline; white-space: nowrap; }
.chip small { font: 500 11px var(--f-num); color: var(--faint); }
.chip:hover { border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }
.select { width: 100%; height: 38px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); padding: 0 10px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; padding: 2px 0; cursor: pointer; }
.toggle input { appearance: none; width: 36px; height: 21px; border-radius: 999px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--surface); transition: translate .15s; }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { translate: 15px 0; }
.toggle span small { display: block; font-size: 12px; color: var(--muted); }
.plat-list { display: grid; gap: 2px; }
.plat-row { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 2px; cursor: pointer; border-radius: 6px; }
.plat-row:hover { background: var(--sunken); }
.plat-row input { accent-color: var(--accent); margin: 0; }
.plat-row .grow { flex: 1; min-width: 0; }
.plat-row small { font: 500 11.5px var(--f-num); color: var(--faint); }
.filters-head { display: none; }
.filter-fab { display: none; }
@media (max-width: 960px) {
  .filters { position: fixed; inset: auto 0 0 0; top: auto; max-height: 82vh; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -12px 40px rgb(0 0 0 / .25); z-index: 40; padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); translate: 0 105%; transition: translate .25s ease; }
  .filters.open { translate: 0 0; }
  .filters-head { display: flex; position: sticky; top: 0; background: var(--surface); padding: 16px 0 10px; justify-content: space-between; align-items: center; z-index: 1; border-bottom: 1px solid var(--line); }
  .filters-head b { font: 800 17px var(--f-display); }
  .filters-head button { border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 7px 16px; font-weight: 600; }
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 35; }
  .filter-fab { display: inline-flex; position: fixed; z-index: 25; left: 50%; translate: -50% 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); padding: 12px 22px; font-weight: 600; box-shadow: var(--shadow); gap: 8px; align-items: center; }
  .filter-fab .num { background: var(--mark); color: var(--mark-ink); border-radius: 999px; padding: 0 7px; font-size: 12px; }
}

/* 결과 헤더 */
.results-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
.results-head h2 { margin: 0; font: 700 17px var(--f-display); letter-spacing: -.02em; }
.results-head h2 .num { color: var(--accent); }
.sort { margin-left: auto; display: flex; gap: 2px; background: var(--sunken); border-radius: 999px; padding: 3px; overflow-x: auto; max-width: 100%; }
.sort button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.sort button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.active-filters:empty { display: none; }
.af { border: 0; background: var(--accent-weak); color: var(--accent); border-radius: 999px; padding: 4px 10px 4px 12px; font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.af::after { content: "×"; font-size: 15px; line-height: 1; }

/* ── 카드 ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px 16px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; } }
.card { position: relative; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); transition: box-shadow .18s, translate .18s; min-width: 0; }
.card:hover { box-shadow: var(--shadow); translate: 0 -2px; }
.card > a { color: inherit; text-decoration: none; display: flex; flex-direction: column; flex: 1; }
.thumb { position: relative; aspect-ratio: 4 / 3; background: var(--sunken); overflow: hidden; max-width: 100%; }
.thumb img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; background: var(--sunken); }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; font: 800 26px var(--f-display); color: var(--faint); letter-spacing: -.04em; text-align: center; padding: 12px; }
.dday, .status-pill { z-index: 2; }
.dday { position: absolute; left: 10px; top: 10px; font: 600 12px var(--f-num); padding: 3px 8px; border-radius: 6px; background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .18); }
.dday.today { background: var(--hot); color: #fff; }
.dday.soon { background: var(--mark); color: var(--mark-ink); }
.dday.open { background: var(--sunken); color: var(--muted); }
.heart { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .9); display: grid; place-items: center; z-index: 2; box-shadow: 0 1px 3px rgb(0 0 0 / .15); color: #1a1f2b; }
.heart svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }
.heart[aria-pressed="true"] { color: #E5383F; }
.heart[aria-pressed="true"] svg { fill: currentColor; }
.body { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.meta { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); min-width: 0; flex-wrap: wrap; }
.meta .plat { font-weight: 600; color: var(--ink); }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.tag.ch-블로그 { background: #E2F4E6; color: #17703A; }
.tag.ch-릴스, .tag.ch-인스타그램 { background: #FCE6F1; color: #A3205F; }
.tag.ch-클립 { background: #E5F0FF; color: #1F56B8; }
.tag.ch-유튜브 { background: #FDE7E5; color: #B42318; }
:root[data-theme="dark"] .tag[class*="ch-"] { background: var(--sunken); color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag[class*="ch-"] { background: var(--sunken); color: var(--ink); } }
.title { margin: 0; font-weight: 600; font-size: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; overflow-wrap: anywhere; }
.reward { margin: 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.reward.none { color: var(--faint); font-style: italic; }
.foot { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); min-width: 0; }
.foot .where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ratio { flex: none; font: 600 12px var(--f-num); padding: 2px 7px; border-radius: 5px; background: var(--sunken); color: var(--muted); }
.ratio.low { background: var(--good-weak); color: var(--good); }
.ratio.high { background: var(--hot-weak); color: var(--hot); }
.status-pill { position: absolute; left: 10px; bottom: 10px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--ink); color: var(--bg); }
@media (max-width: 520px) {
  .body { padding: 9px 10px 11px; }
  .title { font-size: 14px; }
  .reward { -webkit-line-clamp: 1; }
  .meta .tag:nth-of-type(n+2) { display: none; }
}
.more { display: flex; justify-content: center; padding: 28px 0 0; color: var(--muted); font-size: 13px; }
.empty { padding: 56px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
.empty b { display: block; color: var(--ink); font: 700 17px var(--f-display); margin-bottom: 6px; }
.empty button { margin-top: 14px; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 9px 18px; font-weight: 600; }
.skeleton .thumb { animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .55; } }

/* ── 내 체험 (신청 관리) ── */
.board-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.mine-list { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.row .thumb { aspect-ratio: 1; border-radius: var(--r-sm); }
.row .info { min-width: 0; display: grid; gap: 4px; }
.row .info a { color: inherit; text-decoration: none; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .info a:hover { text-decoration: underline; }
.row .sub { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.row .ctrl { display: grid; gap: 6px; justify-items: end; }
.row select, .row input[type="date"] { height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; font-size: 13px; }
.row .rm { border: 0; background: none; color: var(--faint); font-size: 12.5px; padding: 2px; }
.row .rm:hover { color: var(--hot); }
.due { font: 600 12px var(--f-num); color: var(--hot); }
@media (max-width: 620px) {
  .row { grid-template-columns: 64px minmax(0, 1fr); }
  .row .ctrl { grid-column: 1 / -1; grid-auto-flow: column; justify-content: start; align-items: center; justify-items: start; }
}
.backup { margin-top: 28px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; gap: 10px; }
.backup h3 { margin: 0; font: 700 15px var(--f-display); }
.backup p { margin: 0; font-size: 13px; color: var(--muted); }
.backup textarea { width: 100%; min-height: 80px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunken); padding: 8px; font: 12px var(--f-num); resize: vertical; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 500; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ── 데이터 현황 ── */
dialog { border: 0; border-radius: 18px; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 32px)); max-height: 82vh; box-shadow: var(--shadow); }
dialog::backdrop { background: rgb(0 0 0 / .4); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.dlg-head h3 { margin: 0; font: 800 18px var(--f-display); }
.dlg-head button { border: 0; background: var(--sunken); border-radius: 50%; width: 32px; height: 32px; }
.dlg-body { padding: 8px 20px 20px; }
.dlg-body p { font-size: 13px; color: var(--muted); }
.src { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.src td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
.src td:nth-child(2), .src td:nth-child(3) { text-align: right; white-space: nowrap; }
.src .bad { color: var(--hot); font-weight: 600; }

.site-foot { padding-block: 8px 96px; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 12.5px; color: var(--faint); }
.site-foot img { height: 20px; width: auto; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); translate: -50% 20px; opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 60; transition: opacity .2s, translate .2s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; translate: -50% 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="./" aria-label="체험모아 처음으로">
      <span class="brand-mark">모</span><span class="brand-name">체험모아</span>
    </a>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="가게 이름, 지역, 제공 내역 검색" autocomplete="off" aria-label="캠페인 검색">
    </label>
    <nav class="tabs" role="tablist" aria-label="화면 선택">
      <button class="tab" role="tab" id="tab-explore" aria-selected="true" data-view="explore">탐색</button>
      <button class="tab" role="tab" id="tab-mine" aria-selected="false" data-view="mine">내 체험 <span class="cnt num" id="mineCount">0</span></button>
    </nav>
  </div>
</header>

<main>
  <section class="wrap" id="explore">
    <div class="pulse">
      <h1>오늘 신청할 수 있는 체험 <em><span class="num" id="liveCount">—</span>개</em></h1>
      <div class="stats">
        <div class="stat hot"><b class="num" id="todayCount">—</b><span>오늘 마감</span></div>
        <div class="stat"><b class="num" id="newCount">—</b><span>최근 3일 새로 등록</span></div>
        <div class="stat"><b class="num" id="easyCount">—</b><span>경쟁률 3:1 이하</span></div>
      </div>
    </div>
    <div class="fresh" id="fresh"><span><span class="dot"></span>불러오는 중…</span></div>

    <div class="layout">
      <aside class="filters" id="filters" aria-label="필터">
        <div class="filters-head"><b>필터</b><button type="button" id="closeFilters">결과 보기</button></div>

        <div class="fgroup">
          <h3>빠른 조건 <button type="button" id="resetAll">전체 초기화</button></h3>
          <label class="toggle"><span>오늘·내일 마감만<small>놓치기 전에 바로 신청</small></span><input type="checkbox" id="fSoon"></label>
          <label class="toggle"><span>경쟁률 낮은 체험<small>신청자 ÷ 모집 인원 3 이하</small></span><input type="checkbox" id="fEasy"></label>
          <label class="toggle"><span>새로 올라온 체험<small>최근 3일 안에 등록</small></span><input type="checkbox" id="fNew"></label>
        </div>

        <div class="fgroup">
          <h3>체험 방식</h3>
          <div class="chips" id="fType"></div>
        </div>

        <div class="fgroup">
          <h3>지역 <button type="button" id="resetRegion" hidden>초기화</button></h3>
          <div class="chips" id="fProvince"></div>
          <select class="select" id="fDistrict" aria-label="구·시 선택" hidden></select>
        </div>

        <div class="fgroup">
          <h3>리뷰 채널</h3>
          <div class="chips" id="fChannel"></div>
        </div>

        <div class="fgroup">
          <h3>분야</h3>
          <div class="chips" id="fCategory"></div>
        </div>

        <div class="fgroup">
          <h3>플랫폼 <span class="h3-actions"><button type="button" id="resetPlat" hidden>모두 선택</button><button type="button" id="clearPlat">모두 해제</button></span></h3>
          <div class="plat-list" id="fPlatform"></div>
        </div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <div class="results">
        <div class="results-head">
          <h2><span class="num" id="resultCount">0</span>개 캠페인</h2>
          <div class="sort" role="group" aria-label="정렬" id="sort">
            <button type="button" data-sort="deadline" aria-pressed="true">마감 임박순</button>
            <button type="button" data-sort="recent" aria-pressed="false">최신 등록순</button>
            <button type="button" data-sort="ratio" aria-pressed="false">경쟁률 낮은순</button>
            <button type="button" data-sort="seats" aria-pressed="false">모집 많은순</button>
          </div>
          <div class="active-filters" id="activeFilters"></div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="more" id="more"></div>
      </div>
    </div>
    <button class="filter-fab" type="button" id="openFilters">필터 <span class="num" id="filterBadge" hidden>0</span></button>
  </section>

  <section class="wrap" id="mine" hidden>
    <div class="pulse">
      <h1>내 체험 관리</h1>
      <div class="stats" id="mineStats"></div>
    </div>
    <p class="fresh">하트를 누른 캠페인이 여기에 모여요. 원본 사이트에서 신청한 뒤 상태를 바꾸고, 선정되면 리뷰 마감일을 적어 두세요.</p>
    <div class="board-tabs chips" id="mineFilter"></div>
    <div class="mine-list" id="mineList"></div>
    <div class="backup">
      <h3>기록 옮기기</h3>
      <p>관심·신청 기록은 이 브라우저에만 저장돼요. 다른 기기로 옮기려면 복사한 내용을 그 기기에서 붙여 넣으세요.</p>
      <textarea id="backupText" aria-label="백업 내용" placeholder="여기에 백업 내용을 붙여 넣으세요"></textarea>
      <div class="btns">
        <button class="btn" type="button" id="copyBackup">내 기록 복사</button>
        <button class="btn primary" type="button" id="restoreBackup">붙여 넣은 기록 불러오기</button>
      </div>
    </div>
  </section>
</main>

<!-- 방문 수: hits.sh (가입 없는 무료 카운터). 페이지를 열 때마다 1씩 올라간다 -->
<footer class="wrap site-foot">
  <img src="https://hits.sh/hellogit4512.github.io/campaign-moa.svg?view=today-total&amp;label=%EB%B0%A9%EB%AC%B8%20%EC%98%A4%EB%8A%98%2F%EC%A0%84%EC%B2%B4&amp;color=2a52d4&amp;labelColor=5b6578" alt="방문 수" loading="eager" referrerpolicy="no-referrer-when-downgrade" onerror="this.parentNode.hidden=true">
</footer>

<dialog id="sourcesDlg" aria-labelledby="srcTitle">
  <div class="dlg-head"><h3 id="srcTitle">플랫폼별 수집 현황</h3><button type="button" id="closeSrc" aria-label="닫기">✕</button></div>
  <div class="dlg-body">
    <p id="srcNote"></p>
    <table class="src"><tbody id="srcRows"></tbody></table>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const DATA_URL = "data/campaigns.json";
const PAGE = 36;
const STATUSES = [
  { id: "like", label: "관심" },
  { id: "applied", label: "신청함" },
  { id: "picked", label: "선정" },
  { id: "dropped", label: "미선정" },
  { id: "done", label: "리뷰 완료" },
];
const TYPE_ORDER = ["방문", "배송", "기자단", "기타"];
const PROVINCES = ["서울","경기","인천","부산","대구","대전","광주","울산","세종","강원","충북","충남","전북","전남","경북","경남","제주"];
const CHANNELS = ["블로그","릴스","클립","인스타그램","유튜브","구매평"];

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n).toLocaleString("ko-KR");

// ── 저장소 (이 브라우저에만) ──
const store = {
  key: "moa.v1",
  load() { try { return JSON.parse(localStorage.getItem(this.key)) || { items: {} }; } catch { return { items: {} }; } },
  save(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch {} },
};
let mine = store.load();
if (!mine.items) mine = { items: {} };
const prefsKey = "moa.prefs";
function loadPrefs() { try { return JSON.parse(localStorage.getItem(prefsKey)) || {}; } catch { return {}; } }
function savePrefs() { try { localStorage.setItem(prefsKey, JSON.stringify({ sort: state.sort, province: state.province, district: state.district, types: [...state.types], channels: [...state.channels] })); } catch {} }

// ── 상태 ──
const prefs = loadPrefs();
const state = {
  q: "", sort: prefs.sort || "deadline",
  province: prefs.province || "", district: prefs.district || "",
  types: new Set(prefs.types || []), channels: new Set(prefs.channels || []),
  categories: new Set(), platformsOff: new Set(),
  soon: false, easy: false, fresh: false,
  shown: PAGE, mineFilter: "all",
};
let all = [], byId = new Map(), platName = {}, today = "", result = [], meta = null;

// ── 날짜 ──
const kstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const dayDiff = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 86400e3);
function ddayInfo(end) {
  if (!end) return { text: "상시", cls: "open", n: 9999 };
  const n = dayDiff(end, today);
  if (n <= 0) return { text: "오늘 마감", cls: "today", n: 0 };
  if (n <= 2) return { text: `D-${n}`, cls: "soon", n };
  return { text: `D-${n}`, cls: "", n };
}
function ago(iso) {
  if (!iso) return "기록 없음";
  const h = (Date.now() - Date.parse(iso)) / 3600e3;
  if (h < 1) return "방금";
  if (h < 24) return `${Math.floor(h)}시간 전`;
  return `${Math.floor(h / 24)}일 전`;
}

// ── 데이터 ──
function normalize(json) {
  const f = Object.fromEntries(json.fields.map((k, i) => [k, i]));
  platName = Object.fromEntries(json.sources.map((s) => [s.id, s.name]));
  return json.rows.map((r) => {
    const apply = r[f.applicantCount], seats = r[f.selectionCount];
    const ch = (r[f.channel] || "").split("·").map((s) => s.trim()).filter(Boolean);
    const c = {
      id: r[f.id], platform: r[f.platform], title: r[f.title] || "(제목 없음)", url: r[f.url],
      category: r[f.category] || "기타", type: TYPE_ORDER.includes(r[f.type]) ? r[f.type] : "기타",
      province: r[f.province] || "", district: r[f.district] || "", region: r[f.region] || "",
      img: r[f.imageUrl], channels: ch, reward: r[f.reward], end: r[f.endDate],
      apply: apply ?? null, seats: seats ?? null, created: r[f.createdAt] || "",
    };
    // 신청자 0명은 아직 집계 전인 경우가 많아 경쟁률에서 뺀다
    c.ratio = apply > 0 && seats > 0 ? apply / seats : null;
    c.hay = `${c.title} ${c.region} ${c.reward || ""} ${platName[c.platform] || ""}`.toLowerCase();
    return c;
  });
}

async function boot() {
  renderSkeleton();
  try {
    const res = await fetch(DATA_URL, { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    meta = await res.json();
  } catch (e) {
    $("#grid").innerHTML = `<div class="empty" style="grid-column:1/-1"><b>캠페인 목록을 불러오지 못했어요</b>${esc(DATA_URL)} 파일이 있는지 확인하세요. 수집 스크립트(node fetch-campaigns.mjs)를 한 번 실행하면 만들어집니다.</div>`;
    $("#fresh").innerHTML = `<span><span class="dot warn"></span>데이터 없음</span>`;
    return;
  }
  today = kstToday();
  all = normalize(meta).filter((c) => !c.end || c.end >= today);
  byId = new Map(all.map((c) => [c.id, c]));
  renderPulse();
  buildFilters();
  apply();
  renderMineCount();
  if (location.hash === "#mine") switchView("mine");
}

function renderPulse() {
  const recentCut = new Date(Date.parse(today) - 3 * 86400e3).toISOString().slice(0, 10);
  $("#liveCount").textContent = fmt(all.length);
  $("#todayCount").textContent = fmt(all.filter((c) => c.end === today).length);
  $("#newCount").textContent = fmt(all.filter((c) => c.created >= recentCut).length);
  $("#easyCount").textContent = fmt(all.filter((c) => c.ratio != null && c.ratio <= 3).length);
  const stale = meta.sources.filter((s) => !s.lastSyncAt || Date.now() - Date.parse(s.lastSyncAt) > 3 * 86400e3);
  const synced = new Date(meta.syncedAt).toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "numeric", minute: "2-digit" });
  $("#fresh").innerHTML =
    `<span><span class="dot"></span>${esc(synced)} 업데이트 · 매일 자동 갱신</span>` +
    (stale.length ? `<span><span class="dot warn"></span>${stale.length}개 플랫폼은 3일 넘게 새 목록이 없어요</span>` : "") +
    `<button type="button" id="openSrc">수집 현황 보기</button>`;
  $("#openSrc").onclick = openSources;
}

// ── 필터 UI ──
function countBy(list, fn) { const m = new Map(); for (const c of list) for (const k of [].concat(fn(c))) m.set(k, (m.get(k) || 0) + 1); return m; }
function chipHTML(val, label, n, on) { return `<button type="button" class="chip" data-v="${esc(val)}" aria-pressed="${on}">${esc(label)}${n != null ? ` <small>${fmt(n)}</small>` : ""}</button>`; }

function buildFilters() {
  const tc = countBy(all, (c) => c.type);
  $("#fType").innerHTML = TYPE_ORDER.filter((t) => tc.get(t)).map((t) => chipHTML(t, t, tc.get(t), state.types.has(t))).join("");

  const pc = countBy(all, (c) => c.province || "?");
  $("#fProvince").innerHTML = chipHTML("", "전체", null, !state.province) +
    PROVINCES.filter((p) => pc.get(p)).map((p) => chipHTML(p, p, pc.get(p), state.province === p)).join("") +
    (pc.get("전국") ? chipHTML("전국", "전국 배송", pc.get("전국"), state.province === "전국") : "") +
    (pc.get("?") ? chipHTML("?", "지역 미표기", pc.get("?"), state.province === "?") : "");
  buildDistricts();

  const cc = countBy(all, (c) => c.channels.length ? c.channels : []);
  $("#fChannel").innerHTML = CHANNELS.filter((ch) => cc.get(ch)).map((ch) => chipHTML(ch, ch, cc.get(ch), state.channels.has(ch))).join("");

  const kc = countBy(all, (c) => c.category);
  $("#fCategory").innerHTML = [...kc.entries()].sort((a, b) => b[1] - a[1]).map(([k, n]) => chipHTML(k, k, n, state.categories.has(k))).join("");

  const plc = countBy(all, (c) => c.platform);
  $("#fPlatform").innerHTML = [...plc.entries()].sort((a, b) => b[1] - a[1]).map(([id, n]) =>
    `<label class="plat-row"><input type="checkbox" data-v="${esc(id)}" ${state.platformsOff.has(id) ? "" : "checked"}><span class="grow">${esc(platName[id] || id)}</span><small>${fmt(n)}</small></label>`).join("");
}

function buildDistricts() {
  const sel = $("#fDistrict");
  const p = state.province;
  if (!p || p === "?" || p === "전국") { sel.hidden = true; state.district = ""; return; }
  const dc = countBy(all.filter((c) => c.province === p && c.district), (c) => c.district);
  const list = [...dc.entries()].sort((a, b) => a[0].localeCompare(b[0], "ko"));
  if (!list.length) { sel.hidden = true; return; }
  sel.innerHTML = `<option value="">${esc(p)} 전체</option>` + list.map(([d, n]) => `<option value="${esc(d)}">${esc(d)} (${fmt(n)})</option>`).join("");
  if (!dc.has(state.district)) state.district = "";
  sel.value = state.district;
  sel.hidden = false;
}

function toggleSet(set, v) { set.has(v) ? set.delete(v) : set.add(v); }

$("#fType").onclick = (e) => { const b = e.target.closest(".chip"); if (!b) return; toggleSet(state.types, b.dataset.v); b.setAttribute("aria-pressed", state.types.has(b.dataset.v)); apply(); };
$("#fChannel").onclick = (e) => { const b = e.target.closest(".chip"); if (!b) return; toggleSet(state.channels, b.dataset.v); b.setAttribute("aria-pressed", state.channels.has(b.dataset.v)); apply(); };
$("#fCategory").onclick = (e) => { const b = e.target.closest(".chip"); if (!b) return; toggleSet(state.categories, b.dataset.v); b.setAttribute("aria-pressed", state.categories.has(b.dataset.v)); apply(); };
$("#fProvince").onclick = (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.province = b.dataset.v; state.district = "";
  for (const c of $("#fProvince").children) c.setAttribute("aria-pressed", c.dataset.v === state.province);
  buildDistricts(); apply();
};
$("#fDistrict").onchange = (e) => { state.district = e.target.value; apply(); };
$("#fPlatform").onchange = (e) => { const v = e.target.dataset.v; e.target.checked ? state.platformsOff.delete(v) : state.platformsOff.add(v); apply(); };
$("#resetPlat").onclick = () => { state.platformsOff.clear(); for (const i of $("#fPlatform").querySelectorAll("input")) i.checked = true; apply(); };
// 모두 해제한 뒤 보고 싶은 플랫폼만 골라 체크할 수 있게
$("#clearPlat").onclick = () => { for (const i of $("#fPlatform").querySelectorAll("input")) { i.checked = false; state.platformsOff.add(i.dataset.v); } apply(); };
$("#resetRegion").onclick = () => { state.province = ""; state.district = ""; buildFilters(); apply(); };
for (const [id, k] of [["#fSoon", "soon"], ["#fEasy", "easy"], ["#fNew", "fresh"]]) $(id).onchange = (e) => { state[k] = e.target.checked; apply(); };
$("#resetAll").onclick = resetAll;
function resetAll() {
  Object.assign(state, { q: "", province: "", district: "", soon: false, easy: false, fresh: false });
  for (const s of [state.types, state.channels, state.categories, state.platformsOff]) s.clear();
  $("#q").value = ""; $("#fSoon").checked = $("#fEasy").checked = $("#fNew").checked = false;
  buildFilters(); apply();
}

let qTimer;
$("#q").oninput = (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); if (!$("#mine").hidden) switchView("explore"); apply(); }, 160); };
$("#sort").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.sort = b.dataset.sort;
  for (const x of $("#sort").children) x.setAttribute("aria-pressed", x === b);
  apply();
};
for (const x of $("#sort").children) x.setAttribute("aria-pressed", x.dataset.sort === state.sort);

// ── 필터 적용 ──
function apply() {
  const terms = state.q.split(/\s+/).filter(Boolean);
  const recentCut = new Date(Date.parse(today) - 3 * 86400e3).toISOString().slice(0, 10);
  const soonCut = new Date(Date.parse(today) + 86400e3).toISOString().slice(0, 10);
  result = all.filter((c) => {
    if (state.platformsOff.has(c.platform)) return false;
    if (state.types.size && !state.types.has(c.type)) return false;
    if (state.categories.size && !state.categories.has(c.category)) return false;
    if (state.channels.size && !c.channels.some((ch) => state.channels.has(ch))) return false;
    if (state.province) {
      if (state.province === "?" ? c.province : c.province !== state.province) return false;
      if (state.district && c.district !== state.district) return false;
    }
    if (state.soon && !(c.end && c.end <= soonCut)) return false;
    if (state.easy && !(c.ratio != null && c.ratio <= 3)) return false;
    if (state.fresh && !(c.created >= recentCut)) return false;
    for (const t of terms) if (!c.hay.includes(t)) return false;
    return true;
  });
  const by = {
    deadline: (a, b) => (a.end || "9999").localeCompare(b.end || "9999") || (a.ratio ?? 1e9) - (b.ratio ?? 1e9),
    recent: (a, b) => b.created.localeCompare(a.created) || (a.end || "9999").localeCompare(b.end || "9999"),
    ratio: (a, b) => (a.ratio ?? 1e9) - (b.ratio ?? 1e9) || (a.end || "9999").localeCompare(b.end || "9999"),
    seats: (a, b) => (b.seats ?? 0) - (a.seats ?? 0),
  }[state.sort];
  result.sort(by);
  state.shown = PAGE;
  $("#resultCount").textContent = fmt(result.length);
  $("#resetRegion").hidden = !state.province;
  const platCount = $("#fPlatform").querySelectorAll("input").length;
  $("#resetPlat").hidden = !state.platformsOff.size;
  $("#clearPlat").hidden = state.platformsOff.size >= platCount;
  renderActive();
  renderGrid();
  savePrefs();
}

function renderActive() {
  const tags = [];
  if (state.q) tags.push(["q", `“${state.q}”`]);
  if (state.soon) tags.push(["soon", "오늘·내일 마감"]);
  if (state.easy) tags.push(["easy", "경쟁률 3:1 이하"]);
  if (state.fresh) tags.push(["fresh", "새로 등록"]);
  if (state.province) tags.push(["province", (state.province === "?" ? "지역 미표기" : state.province === "전국" ? "전국 배송" : state.province) + (state.district ? ` ${state.district}` : "")]);
  for (const t of state.types) tags.push(["types:" + t, t]);
  for (const t of state.channels) tags.push(["channels:" + t, t]);
  for (const t of state.categories) tags.push(["categories:" + t, t]);
  const platTotal = $("#fPlatform").querySelectorAll("input").length;
  const platOn = platTotal - state.platformsOff.size;
  if (state.platformsOff.size) tags.push(["plat", platOn === 0 ? "플랫폼 선택 안 함" : platOn <= state.platformsOff.size ? `플랫폼 ${platOn}곳만` : `플랫폼 ${state.platformsOff.size}곳 제외`]);
  $("#activeFilters").innerHTML = tags.map(([k, l]) => `<button type="button" class="af" data-k="${esc(k)}" aria-label="${esc(l)} 조건 빼기">${esc(l)}</button>`).join("");
  const b = $("#filterBadge"); b.textContent = tags.length; b.hidden = !tags.length;
}
$("#activeFilters").onclick = (e) => {
  const b = e.target.closest(".af"); if (!b) return;
  const k = b.dataset.k;
  if (k === "q") { state.q = ""; $("#q").value = ""; }
  else if (k === "soon" || k === "easy" || k === "fresh") { state[k] = false; $({ soon: "#fSoon", easy: "#fEasy", fresh: "#fNew" }[k]).checked = false; }
  else if (k === "province") { state.province = ""; state.district = ""; }
  else if (k === "plat") state.platformsOff.clear();
  else { const [set, v] = k.split(":"); state[set].delete(v); }
  buildFilters(); apply();
};

// ── 카드 ──
const heartSVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z" stroke-linejoin="round"/></svg>`;
function ratioHTML(c) {
  if (c.ratio == null) return c.seats ? `<span class="ratio num">${fmt(c.seats)}명 모집</span>` : "";
  if (c.ratio < 1) return `<span class="ratio num low" title="신청 ${fmt(c.apply)}명 / 모집 ${fmt(c.seats)}명">미달</span>`;
  const cls = c.ratio <= 3 ? "low" : c.ratio >= 20 ? "high" : "";
  const r = c.ratio < 10 ? c.ratio.toFixed(1) : Math.round(c.ratio);
  return `<span class="ratio num ${cls}" title="신청 ${fmt(c.apply)}명 / 모집 ${fmt(c.seats)}명">${r}:1</span>`;
}
function thumbHTML(c) {
  const ph = `<div class="ph">${esc(platName[c.platform] || c.platform)}</div>`;
  return c.img ? `${ph}<img src="${esc(c.img)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">` : ph;
}
function cardHTML(c) {
  const d = ddayInfo(c.end);
  const st = mine.items[c.id]?.s;
  const where = c.province === "전국" || c.type === "배송" ? "전국 배송" : (c.region || "지역 미표기");
  const stLabel = st && st !== "like" ? STATUSES.find((x) => x.id === st)?.label : "";
  return `<article class="card" data-id="${esc(c.id)}">
    <button type="button" class="heart" aria-pressed="${!!st}" aria-label="관심 캠페인에 담기">${heartSVG}</button>
    <a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">
      <div class="thumb">${thumbHTML(c)}<span class="dday num ${d.cls}">${d.text}</span>${stLabel ? `<span class="status-pill">${esc(stLabel)}</span>` : ""}</div>
      <div class="body">
        <div class="meta"><span class="plat">${esc(platName[c.platform] || c.platform)}</span>${c.channels.slice(0, 2).map((ch) => `<span class="tag ch-${esc(ch)}">${esc(ch)}</span>`).join("")}<span class="tag">${esc(c.type)}</span></div>
        <h3 class="title">${esc(c.title)}</h3>
        <p class="reward ${c.reward ? "" : "none"}">${esc(c.reward || "제공 내역은 원본에서 확인")}</p>
        <div class="foot"><span class="where">${esc(where)}</span>${ratioHTML(c)}</div>
      </div>
    </a>
  </article>`;
}
function renderSkeleton() {
  $("#grid").innerHTML = Array.from({ length: 8 }, () => `<article class="card skeleton"><div class="thumb"></div><div class="body"><div class="meta">&nbsp;</div><div class="title">&nbsp;</div><p class="reward">&nbsp;</p></div></article>`).join("");
}
function renderGrid() {
  const grid = $("#grid");
  if (!result.length) {
    const noPlat = state.platformsOff.size >= $("#fPlatform").querySelectorAll("input").length;
    grid.innerHTML = noPlat
      ? `<div class="empty" style="grid-column:1/-1"><b>선택한 플랫폼이 없어요</b>필터의 플랫폼 목록에서 보고 싶은 곳을 체크해 주세요.</div>`
      : `<div class="empty" style="grid-column:1/-1"><b>조건에 맞는 캠페인이 없어요</b>조건을 하나씩 빼 보거나 지역을 넓혀 보세요.<br><button type="button" id="emptyReset">조건 모두 지우기</button></div>`;
    if (!noPlat) $("#emptyReset").onclick = resetAll;
    $("#more").textContent = "";
    return;
  }
  grid.innerHTML = result.slice(0, state.shown).map(cardHTML).join("");
  updateMore();
}
function appendMore() {
  if (state.shown >= result.length) return;
  const from = state.shown;
  state.shown = Math.min(result.length, state.shown + PAGE);
  $("#grid").insertAdjacentHTML("beforeend", result.slice(from, state.shown).map(cardHTML).join(""));
  updateMore();
}
function updateMore() {
  $("#more").innerHTML = state.shown < result.length
    ? `<span class="num">${fmt(state.shown)} / ${fmt(result.length)}</span>&nbsp;· 스크롤하면 더 보여요`
    : result.length > PAGE ? "마지막 캠페인까지 다 봤어요" : "";
}
new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting) && !$("#explore").hidden) appendMore(); }, { rootMargin: "900px" }).observe($("#more"));

// 하트 → 관심 등록/해제
$("#grid").onclick = (e) => {
  const h = e.target.closest(".heart"); if (!h) return;
  e.preventDefault();
  const id = h.closest(".card").dataset.id;
  const c = byId.get(id);
  if (mine.items[id]) {
    if (mine.items[id].s !== "like") { toast("신청 기록이 있어요. 내 체험에서 지워 주세요"); return; }
    delete mine.items[id]; h.setAttribute("aria-pressed", "false"); toast("관심에서 뺐어요");
  } else {
    mine.items[id] = { s: "like", at: today, c: snapshot(c) }; h.setAttribute("aria-pressed", "true"); toast("내 체험에 담았어요");
  }
  store.save(mine); renderMineCount();
};
const snapshot = (c) => ({ id: c.id, platform: c.platform, title: c.title, url: c.url, img: c.img, region: c.region, end: c.end, type: c.type, reward: c.reward });

// ── 모바일 필터 시트 ──
const openSheet = (on) => { $("#filters").classList.toggle("open", on); $("#scrim").hidden = !on; document.body.style.overflow = on ? "hidden" : ""; };
$("#openFilters").onclick = () => openSheet(true);
$("#closeFilters").onclick = () => openSheet(false);
$("#scrim").onclick = () => openSheet(false);

// ── 화면 전환 ──
function switchView(v) {
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", t.dataset.view === v);
  $("#explore").hidden = v !== "explore";
  $("#mine").hidden = v !== "mine";
  if (v === "mine") renderMine();
  else renderGrid();
  scrollTo({ top: 0 });
}
for (const t of document.querySelectorAll(".tab")) t.onclick = () => switchView(t.dataset.view);

// ── 내 체험 ──
function renderMineCount() { $("#mineCount").textContent = Object.keys(mine.items).length; }
function renderMine() {
  const items = Object.entries(mine.items).map(([id, it]) => ({ id, ...it, live: byId.get(id) }));
  const cnt = Object.fromEntries(STATUSES.map((s) => [s.id, 0]));
  for (const it of items) cnt[it.s] = (cnt[it.s] || 0) + 1;
  const dueSoon = items.filter((it) => it.s === "picked" && it.due && dayDiff(it.due, today) <= 3).length;
  $("#mineStats").innerHTML =
    `<div class="stat"><b class="num">${cnt.applied}</b><span>결과 기다리는 중</span></div>` +
    `<div class="stat"><b class="num">${cnt.picked}</b><span>선정 · 리뷰 작성할 것</span></div>` +
    `<div class="stat hot"><b class="num">${dueSoon}</b><span>리뷰 마감 3일 이내</span></div>`;
  $("#mineFilter").innerHTML = chipHTML("all", "전체", items.length, state.mineFilter === "all") +
    STATUSES.map((s) => chipHTML(s.id, s.label, cnt[s.id], state.mineFilter === s.id)).join("");
  const list = items.filter((it) => state.mineFilter === "all" || it.s === state.mineFilter)
    .sort((a, b) => STATUSES.findIndex((s) => s.id === a.s) - STATUSES.findIndex((s) => s.id === b.s) || (a.due || a.c?.end || "9999").localeCompare(b.due || b.c?.end || "9999"));
  if (!list.length) {
    $("#mineList").innerHTML = `<div class="empty"><b>${items.length ? "이 상태의 캠페인이 없어요" : "아직 담은 캠페인이 없어요"}</b>탐색 화면에서 마음에 드는 캠페인의 하트를 눌러 보세요.</div>`;
    return;
  }
  $("#mineList").innerHTML = list.map((it) => {
    const c = it.live || it.c || {};
    const d = c.end ? ddayInfo(c.end) : null;
    const closed = !it.live && c.end && c.end < today;
    const due = it.s === "picked" && it.due ? dayDiff(it.due, today) : null;
    return `<div class="row" data-id="${esc(it.id)}">
      <div class="thumb">${thumbHTML(c)}</div>
      <div class="info">
        <a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title)}</a>
        <div class="sub"><span>${esc(platName[c.platform] || c.platform || "")}</span><span>${esc(c.region || "")}</span>
          ${closed ? "<span>모집 종료</span>" : d ? `<span class="num">모집 ${d.text}</span>` : ""}
          ${due != null ? `<span class="due">${due < 0 ? `리뷰 마감 ${-due}일 지남` : due === 0 ? "오늘 리뷰 마감" : `리뷰 마감 D-${due}`}</span>` : ""}</div>
      </div>
      <div class="ctrl">
        <select aria-label="진행 상태" data-act="status">${STATUSES.map((s) => `<option value="${s.id}" ${s.id === it.s ? "selected" : ""}>${s.label}</option>`).join("")}</select>
        ${it.s === "picked" ? `<input type="date" aria-label="리뷰 마감일" data-act="due" value="${esc(it.due || "")}">` : ""}
        <button type="button" class="rm" data-act="remove">지우기</button>
      </div>
    </div>`;
  }).join("");
}
$("#mineFilter").onclick = (e) => { const b = e.target.closest(".chip"); if (!b) return; state.mineFilter = b.dataset.v; renderMine(); };
$("#mineList").onchange = (e) => {
  const row = e.target.closest(".row"); const it = mine.items[row.dataset.id]; if (!it) return;
  if (e.target.dataset.act === "status") { it.s = e.target.value; toast(`‘${STATUSES.find((s) => s.id === it.s).label}’(으)로 바꿨어요`); }
  if (e.target.dataset.act === "due") it.due = e.target.value;
  store.save(mine); renderMine();
};
$("#mineList").onclick = (e) => {
  if (e.target.dataset.act !== "remove") return;
  const id = e.target.closest(".row").dataset.id;
  const btn = e.target;
  if (btn.dataset.confirm) { delete mine.items[id]; store.save(mine); renderMine(); renderMineCount(); toast("지웠어요"); }
  else { btn.dataset.confirm = "1"; btn.textContent = "한 번 더 누르면 삭제"; btn.style.color = "var(--hot)"; }
};
$("#copyBackup").onclick = async () => {
  const text = JSON.stringify(mine);
  $("#backupText").value = text;
  try { await navigator.clipboard.writeText(text); toast("기록을 복사했어요"); }
  catch { $("#backupText").select(); toast("아래 내용을 직접 복사해 주세요"); }
};
$("#restoreBackup").onclick = () => {
  try {
    const d = JSON.parse($("#backupText").value);
    if (!d || typeof d.items !== "object") throw 0;
    const n = Object.keys(d.items).length;
    mine.items = { ...mine.items, ...d.items }; store.save(mine);
    renderMine(); renderMineCount(); toast(`${n}개 기록을 불러왔어요`);
  } catch { toast("백업 형식이 아니에요. 복사한 내용을 그대로 붙여 넣어 주세요"); }
};

// ── 수집 현황 ──
function openSources() {
  const rows = [...meta.sources].sort((a, b) => (b.records || 0) - (a.records || 0));
  const live = countBy(all, (c) => c.platform);
  $("#srcNote").textContent = `진행 중인 캠페인만 보여 줘요. 마지막 갱신이 3일을 넘은 플랫폼은 원본 사이트에서 직접 확인하는 게 정확해요.`;
  $("#srcRows").innerHTML = `<tr><td><b>플랫폼</b></td><td><b>진행 중</b></td><td><b>마지막 갱신</b></td></tr>` + rows.map((s) => {
    const stale = !s.lastSyncAt || Date.now() - Date.parse(s.lastSyncAt) > 3 * 86400e3;
    const when = s.status === "login_required" ? `로그인 필요 · ${ago(s.lastSyncAt)}` : ago(s.lastSyncAt);
    return `<tr><td><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a></td><td class="num">${fmt(live.get(s.id) || 0)}</td><td class="${stale || s.status === "login_required" ? "bad" : ""}">${esc(when)}</td></tr>`;
  }).join("");
  $("#sourcesDlg").showModal();
}
$("#closeSrc").onclick = () => $("#sourcesDlg").close();

let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800); }

boot();
})();
</script>
</body>
</html>
