# GitHub에 올려서 쓸 때: 매일 오전 7시(KST)에 캠페인 목록을 새로 받아 커밋합니다.
# GitHub Pages(또는 Netlify/Vercel)가 이 저장소를 배포하면 사이트가 매일 자동으로 갱신돼요.
name: 매일 캠페인 수집
on:
  schedule:
    - cron: "0 22 * * *" # UTC 22:00 = KST 07:00
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch-campaigns.mjs
      - name: 변경 사항 커밋
        run: |
          git config user.name "campaign-moa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/campaigns.json data/first-seen.json
          git diff --cached --quiet || git commit -m "캠페인 목록 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
